twig:
    file_name_pattern: '*.twig'
    # Le PHP de l'hébergeur est en UTC : sans ceci, les heures affichées (mails, pages) sont décalées d'une heure.
    date:
        timezone: Europe/Paris
    globals:
        event: '@App\Event\EventInfo'
        club:
            name: 'US Cormeilles Lieurey'
            address: 'Mairie, rue de l''Abbaye, 27260 Cormeilles'
            email: 'soiree@uscormeilleslieurey.fr'
            retention_months: '%app.retention_months%'

when@test:
    twig:
        strict_variables: true
