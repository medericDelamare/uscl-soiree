services:

  php:
    build:
      context: services/php
      args:
        - DEV_UID=${DEV_UID}
        - DEV_GID=${DEV_GID}
    volumes:
      - ..:/var/www/
    environment:
      - COMPOSER_HOME=/tmp/composer
    ports:
      - ${PHP_PORT}:80
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - ${MYSQL_HOST_PORT}:3306

  phpmyadmin:
    image: phpmyadmin
    depends_on:
      - mysql
    ports:
      - ${PMA_PORT}:80
    environment:
      PMA_HOSTS: mysql

  maildev:
    image: maildev/maildev
    ports:
      - ${MAILDEV_PORT}:1080

volumes:
  mysql-data:
